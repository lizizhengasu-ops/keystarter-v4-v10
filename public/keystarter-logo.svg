<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <circle cx="50" cy="50" r="40" stroke="#1d1d1f" stroke-width="1.2"/>
  <ellipse cx="50" cy="50" rx="36" ry="14" stroke="#7c3aed" stroke-width="1.2" transform="rotate(-30 50 50)">
    <animateTransform attributeName="transform" type="rotate" from="-30 50 50" to="330 50 50" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="50" cy="50" rx="36" ry="14" stroke="#7c3aed" stroke-width="1.2" transform="rotate(30 50 50)">
    <animateTransform attributeName="transform" type="rotate" from="30 50 50" to="-330 50 50" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="50" cy="50" r="5" fill="#7c3aed">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
