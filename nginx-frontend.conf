server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name keys-starter.com www.keys-starter.com;

    ssl_certificate /etc/ssl/certs/keys-starter.pem;
    ssl_certificate_key /etc/ssl/private/keys-starter.key;

    # Frontend SPA
    root /var/www/keystarter-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # WordPress API proxy
    location /wp-json/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location /wp-admin/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location /wp-content/ { proxy_pass http://127.0.0.1:8080; }
    location /wp-includes/ { proxy_pass http://127.0.0.1:8080; }
    location /xmlrpc.php { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location ~ /\.ht { deny all; }
}

server {
    listen 127.0.0.1:8080;
    server_name keys-starter.com;

    root /var/www/keys-starter.com;
    index index.php;

    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
    }
    location ~ /\.ht { deny all; }
}
