index index.html;
    location ^~ /wp-json/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost; proxy_redirect http://keys-starter.com:8080/ https://keys-starter.com/; }
    location ^~ /wp-admin/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost; proxy_redirect http://keys-starter.com:8080/ https://keys-starter.com/; }
    location ^~ /wp-content/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost; proxy_redirect http://keys-starter.com:8080/ https://keys-starter.com/; }
    location ^~ /wp-includes/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost; proxy_redirect http://keys-starter.com:8080/ https://keys-starter.com/; }
    location ^~ /checkout/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost; proxy_redirect http://keys-starter.com:8080/ https://keys-starter.com/; }
    location ^~ /cart/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost; proxy_redirect http://keys-starter.com:8080/ https://keys-starter.com/; }
location = /xmlrpc.php { deny all; return 403; }
location = /wp-login.php { limit_req zone=wp_login burst=3 nodelay; proxy_pass http://127.0.0.1:8080; proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost; }
location /assets/ { root /var/www/keystarter-frontend; }
location = /consumer { rewrite ^ /consumer_dashboard.html last; }
location = /buyer { rewrite ^ /buyer_dashboard.html last; }
